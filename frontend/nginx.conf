# Конфигурация nginx для раздачи SPA и проксирования API на бэкенд.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Сжатие
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Заголовки безопасности
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Статика с длительным кэшем (файлы содержат хеш в имени)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Изображения предметов
    location /items/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # API проксируется на бэкенд: cookie остаются first-party
    location /api/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Маршрутизация SPA: любой путь отдаёт index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
