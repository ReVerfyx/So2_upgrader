<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<meta name="theme-color" content="#0f1013">

<meta property="og:type" content="website">
<meta property="og:site_name" content="{{brand}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{siteUrl}}/assets/img/og.png">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/img/favicon.svg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700;800&family=Tektur:wght@600;700;800&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
{{headExtra}}
</head>
<body class="{{bodyClass}}">
<a class="skip-link" href="#main">К содержимому</a>
{{header}}
<main id="main">
{{body}}
</main>
{{footer}}

<div class="toaster" id="toaster" role="status" aria-live="polite"></div>

<script src="assets/js/config.js"></script>
<script src="assets/js/core.js" defer></script>
{{scripts}}
</body>
</html>
