<header class="site-header">
  <div class="wrap header-inner">
    <a class="logo" href="index.html" aria-label="{{brand}} — на главную">
      <span class="logo-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="30" height="30"><path d="M16 2 3 9v14l13 7 13-7V9L16 2Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="m11 18 5-8 5 8h-3.4l-1.6-2.6L14.4 18H11Z" fill="currentColor"/><path d="M11 21h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </span>
      <span class="logo-text">
        <b>{{brand}}</b>
        <i>{{tagline}}</i>
      </span>
    </a>

    <nav class="nav" id="nav" aria-label="Основное меню">
      <a data-nav="gold" href="gold.html">Голда</a>
      <a data-nav="skins" href="skins.html">Скины</a>
      <a data-nav="sell" href="sell.html">Продать</a>
      <a data-nav="orders" href="orders.html">Заказы</a>
      <a data-nav="faq" href="faq.html">FAQ</a>
    </nav>

    <div class="header-side">
      <span class="rate-chip" id="rate-chip" title="Актуальный курс TON">
        <span class="ton-dot" aria-hidden="true"></span><span id="rate-value">TON —</span>
      </span>
      <a class="btn btn-ghost btn-sm hide-sm" href="{{contacts.telegram}}" target="_blank" rel="noopener">Поддержка</a>
      <a class="cart-btn" href="cart.html" aria-label="Корзина">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 7h13l-1.4 8.2a2 2 0 0 1-2 1.8H9.4a2 2 0 0 1-2-1.7L6 7Zm0 0-.6-3H3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="10" cy="20" r="1.4" fill="currentColor"/><circle cx="17" cy="20" r="1.4" fill="currentColor"/></svg>
        <span class="cart-count" id="cart-count" hidden>0</span>
      </a>
      <button class="burger" id="burger" aria-label="Меню" aria-expanded="false" aria-controls="nav">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>
